# Builds the slim serving image once per GPU family, installing the prebuilt flash-attn
# wheel from "Build flash-attn wheels", and pushes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:sm120   (and :sm120-<short sha>)
name: Build and push image

on:
  workflow_dispatch:
    inputs:
      archs:
        description: 'JSON list of archs to build (must already have wheels)'
        required: true
        default: '["80","90","120"]'
      install_voxcpm:
        description: 'Include the reference VoxCPM engine (ENGINE=default)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - handler.py
      - Dockerfile
      - voices/**
      - versions.env
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image sm_${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # On push, edit this default to the archs you actually serve.
        arch: ${{ fromJSON(inputs.archs || '["80","90","120"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Load versions.env
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Download flash-attn wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fa${FLASH_ATTN_VERSION}-nv${NANOVLLM_REF}-sm${{ matrix.arch }}"
          mkdir -p wheels
          gh release download "$TAG" -p '*.whl' -D wheels \
            || { echo "::error::No release $TAG. Run 'Build flash-attn wheels' for sm_${{ matrix.arch }} first."; exit 1; }
          ls -lh wheels

      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            NANOVLLM_REPO=${{ env.NANOVLLM_REPO }}
            NANOVLLM_REF=${{ env.NANOVLLM_REF }}
            UV_VERSION=${{ env.UV_VERSION }}
            FA_ARCH=${{ matrix.arch }}
            INSTALL_VOXCPM=${{ (github.event_name == 'push' || inputs.install_voxcpm) && '1' || '0' }}
          tags: |
            ${{ env.IMAGE }}:sm${{ matrix.arch }}
            ${{ env.IMAGE }}:sm${{ matrix.arch }}-${{ env.SHORT_SHA }}
